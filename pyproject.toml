[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "free-model"
version = "0.1.0"
description = "A free, open-source model project skeleton (Python)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "q1216081403" }]
keywords = ["model", "open-source", "machine-learning", "skeleton"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
export = ["onnx", "onnxruntime", "safetensors"]

[project.urls]
Homepage = "https://github.com/q1216081403/free-model"
Repository = "https://github.com/q1216081403/free-model"

[tool.setuptools.packages.find]
where = ["src"]
